appId: com.troodie.troodie.com
env:
  TEST_EMAIL: test-consumer1@bypass.com
tags:
  - regression
  - tro-152
---
# TRO-152: Update Toast Banner
# Verifies the update banner infrastructure works on the home screen.
#
# NOTE: The banner only appears when the App Store version is NEWER than the
# installed app version. During E2E testing against a dev build, the banner
# may or may not appear depending on whether the store version exceeds the
# local app.config.js version (currently 1.0.15).
#
# This test validates:
# 1. The home screen loads without crashing (banner code integrated correctly)
# 2. IF the banner is visible: dismiss button works
# 3. The home screen renders and scrolls normally
#
# Account: test-consumer1@bypass.com (consumer)

# Step 1: Login
- runFlow: ../../helpers/login-bypass.yaml

- waitForAnimationToEnd

# Step 2: Verify home screen loaded successfully
- extendedWaitUntil:
    visible: "Your Saves"
    timeout: 15000

- takeScreenshot: "tro152-home-screen-loaded"

# Wait for any toast notifications to dismiss (e.g., location error)
- waitForAnimationToEnd
- waitForAnimationToEnd

# Step 3: Dismiss error toast if shown
- tapOn:
    text: "✕"
    optional: true

- waitForAnimationToEnd

# Step 4: If update banner IS visible, test dismiss functionality
- tapOn:
    id: "update-banner-dismiss"
    optional: true

- waitForAnimationToEnd

- takeScreenshot: "tro152-after-banner-interaction"

# Step 4: Scroll the home screen to verify no layout issues
- swipe:
    direction: UP

- waitForAnimationToEnd

- takeScreenshot: "tro152-home-scroll-after-banner"

# Step 5: Scroll back up
- swipe:
    direction: DOWN

- waitForAnimationToEnd

- takeScreenshot: "tro152-banner-stays-dismissed"
