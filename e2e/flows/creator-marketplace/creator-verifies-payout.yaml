appId: com.troodie.troodie.com
env:
  TEST_EMAIL: test-creator1@bypass.com
---
# Test: Creator verifies payout received
# Priority: P1 (Critical for Payment Flow)
# Prerequisites:
#   - Creator account (test-creator1) logged in
#   - Deliverable approved (payout triggered)
# Tags: creator, payout, earnings, verification
# Navigation: More tab → Payments & Earnings
#
# NOTE: iOS 26 simulator has persistent location error toast that
# corrupts the accessibility tree. ALL taps on More screen use
# point-based coordinates to avoid text selector failures.
#
# More screen layout (Creator account - measured from screenshots):
#   ~35% - Creator Profile
#   ~42% - Explore Campaigns
#   ~48% - My Campaigns
#   ~55% - My Deliverables
#   ~61% - Payments & Earnings

# Login as creator
- runFlow: ../../helpers/login-bypass.yaml

# Navigate to More tab (rightmost tab, 5th of 5)
- tapOn:
    point: "90%,97%"

- waitForAnimationToEnd
- waitForAnimationToEnd

# Tap Payments & Earnings (~61% from top)
- tapOn:
    point: "50%,61%"

- waitForAnimationToEnd
- waitForAnimationToEnd

# Take screenshot to verify what screen we're on
- takeScreenshot: "creator-after-payments-tap"

# Verify earnings screen (optional - may fail due to toast)
- assertVisible:
    text: "Earnings"
    optional: true

# Look for payout entry
- assertVisible:
    text: "$"
    optional: true

# Check payout status
- assertVisible:
    text: "completed"
    optional: true

- assertVisible:
    text: "processing"
    optional: true

# Take screenshot
- takeScreenshot: "creator-earnings-verified"

# Navigate to payout details
- tapOn:
    id: "payout-item-0"
    optional: true

- waitForAnimationToEnd

- assertVisible:
    text: "Campaign"
    optional: true

- takeScreenshot: "creator-payout-details"
