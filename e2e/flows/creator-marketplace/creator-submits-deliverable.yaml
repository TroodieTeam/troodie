appId: com.troodie.troodie.com
env:
  TEST_EMAIL: test-creator1@bypass.com
---
# Test: Creator submits deliverable for accepted campaign
# Priority: P1 (Critical for Creator Marketplace)
# Prerequisites:
#   - Creator account (test-creator1) logged in
#   - Accepted application exists
# Tags: creator, deliverable, submission
# Navigation: More tab → My Campaigns → Active → Campaign
#
# NOTE: iOS 26 simulator toast corrupts accessibility tree.
# All More screen taps use point-based coordinates.
# Creator More screen layout:
#   ~35% - Creator Profile
#   ~42% - Explore Campaigns
#   ~48% - My Campaigns
#   ~55% - My Deliverables
#   ~61% - Payments & Earnings

# Login as creator
- runFlow: ../../helpers/login-bypass.yaml

# Navigate to More tab (rightmost tab)
- tapOn:
    point: "90%,97%"

- waitForAnimationToEnd
- waitForAnimationToEnd

# Tap My Campaigns (~48% from top)
- tapOn:
    point: "50%,48%"

- waitForAnimationToEnd
- waitForAnimationToEnd

# Take screenshot to verify navigation
- takeScreenshot: "creator-my-campaigns"

# Go to Active tab (should be default, but tap to ensure)
- tapOn:
    text: "Active"
    optional: true

- waitForAnimationToEnd

# Find accepted campaign
- assertVisible:
    text: "Active"
    optional: true

# Tap on the campaign card
- tapOn:
    text: "Test Campaign"
    optional: true

- waitForAnimationToEnd

# Verify submit deliverable screen
- assertVisible:
    text: "Deliverable"
    optional: true

- assertVisible:
    text: "Upload"
    optional: true

# Take screenshot
- takeScreenshot: "creator-submit-deliverable-screen"

# Enter content URL if available
- tapOn:
    id: "content-url-input"
    optional: true

- tapOn:
    text: "URL"
    optional: true

- inputText: "https://www.instagram.com/reel/TEST123MAESTRO/"
- hideKeyboard

# Enter notes
- tapOn:
    id: "notes-input"
    optional: true

- scrollUntilVisible:
    element:
      id: "notes-input"
    direction: DOWN
    optional: true

- inputText: "Here's my content for the campaign!"
- hideKeyboard

# Submit
- scrollUntilVisible:
    element:
      text: "Submit"
    direction: DOWN
    optional: true

- tapOn:
    text: "Submit"
    optional: true

# Confirm
- tapOn:
    text: "Confirm"
    optional: true

- waitForAnimationToEnd

# Verify success
- assertVisible:
    text: "submitted"
    optional: true

- assertVisible:
    text: "Success"
    optional: true

- tapOn:
    text: "OK"
    optional: true

# Take screenshot
- takeScreenshot: "creator-deliverable-submitted"
