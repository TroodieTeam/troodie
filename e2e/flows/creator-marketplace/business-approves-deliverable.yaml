appId: com.troodie.troodie.com
env:
  TEST_EMAIL: test-business1@bypass.com
---
# Test: Business approves deliverable (triggers payout)
# Priority: P1 (Critical for Payment Flow)
# Prerequisites:
#   - Business account (test-business1) logged in
#   - Submitted deliverable exists
# Tags: business, deliverable, approval, payout
# Navigation: More tab → Manage Campaigns → Campaign Detail → Deliverables
#
# NOTE: iOS 26 simulator toast corrupts accessibility tree.
# All More screen taps use point-based coordinates.
# Business More screen layout:
#   ~35% - Business Dashboard
#   ~42% - Manage Campaigns
#   ~48% - Discover Creators
#   ~55% - Campaign Analytics
#   ~61% - Restaurant Settings

# Login as business
- runFlow: ../../helpers/login-bypass.yaml

# Navigate to More tab (rightmost tab)
- tapOn:
    point: "90%,97%"

- waitForAnimationToEnd
- waitForAnimationToEnd

# Tap Manage Campaigns (~42% from top)
- tapOn:
    point: "50%,42%"

- waitForAnimationToEnd
- waitForAnimationToEnd

# Take screenshot
- takeScreenshot: "business-manage-campaigns"

# Find campaign with deliverables
- tapOn:
    text: "Test Campaign"
    optional: true

- waitForAnimationToEnd

# Navigate to Deliverables tab
- tapOn:
    text: "Deliverables"
    optional: true

- tapOn:
    text: "Review"
    optional: true

- waitForAnimationToEnd

# Find pending deliverable
- assertVisible:
    text: "Pending"
    optional: true

# Tap on deliverable to review
- tapOn:
    id: "deliverable-card-0"
    optional: true

- tapOn:
    text: "Review"
    optional: true

- waitForAnimationToEnd

# Approve deliverable
- scrollUntilVisible:
    element:
      text: "Approve"
    direction: DOWN
    optional: true

- tapOn:
    text: "Approve"
    optional: true

# Confirm approval
- waitForAnimationToEnd

- tapOn:
    text: "Confirm"
    optional: true

- tapOn:
    text: "Yes, Approve"
    optional: true

- waitForAnimationToEnd

# Verify approval
- assertVisible:
    text: "approved"
    optional: true

- assertVisible:
    text: "Success"
    optional: true

- tapOn:
    text: "OK"
    optional: true

# Take screenshot
- takeScreenshot: "business-deliverable-approved"

# Verify payout initiated
- assertVisible:
    text: "Payout"
    optional: true

- takeScreenshot: "payout-initiated"
