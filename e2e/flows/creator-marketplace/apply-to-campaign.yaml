appId: com.troodie.troodie.com
env:
  TEST_EMAIL: test-creator1@bypass.com
---
# Test: Creator applies to a paid campaign
# Priority: P1 (Critical for Creator Marketplace)
# Prerequisites:
#   - Creator account (test-creator1) logged in
#   - Active paid campaigns exist
# Tags: creator, campaign, application
# Navigation: More tab → Explore Campaigns
#
# NOTE: iOS 26 simulator toast corrupts accessibility tree.
# All More screen taps use point-based coordinates.
# Creator More screen layout:
#   ~35% - Creator Profile
#   ~42% - Explore Campaigns
#   ~48% - My Campaigns
#   ~55% - My Deliverables
#   ~61% - Payments & Earnings

# Login as creator
- runFlow: ../../helpers/login-bypass.yaml

# Navigate to More tab (rightmost tab)
- tapOn:
    point: "90%,97%"

- waitForAnimationToEnd
- waitForAnimationToEnd

# Tap Explore Campaigns (~42% from top)
- tapOn:
    point: "50%,42%"

- waitForAnimationToEnd
- waitForAnimationToEnd

# Take screenshot to verify navigation
- takeScreenshot: "creator-explore-campaigns"

# Verify campaigns screen loaded
- assertVisible:
    text: "Explore"
    optional: true

# Scroll to find a campaign
- scrollUntilVisible:
    element:
      text: "$"
    direction: DOWN
    optional: true

# Tap on first campaign card
- tapOn:
    text: "Test Campaign"
    optional: true

- waitForAnimationToEnd

# Tap Apply button
- tapOn:
    text: "Apply"
    optional: true

- tapOn:
    text: "Apply Now"
    optional: true

# Wait for application form
- waitForAnimationToEnd

# Fill application form
- assertVisible:
    text: "Application"
    optional: true

# Cover Letter
- tapOn:
    id: "cover-letter-input"
    optional: true

- inputText: "I'm excited to create content for your restaurant!"
- hideKeyboard

# Submit application
- scrollUntilVisible:
    element:
      text: "Submit"
    direction: DOWN
    optional: true

- tapOn:
    text: "Submit Application"
    optional: true

- tapOn:
    text: "Submit"
    optional: true

# Wait for confirmation
- waitForAnimationToEnd

# Verify success
- assertVisible:
    text: "submitted"
    optional: true

- assertVisible:
    text: "Success"
    optional: true

- tapOn:
    text: "OK"
    optional: true

- tapOn:
    text: "Done"
    optional: true

# Take screenshot
- takeScreenshot: "creator-application-submitted"
