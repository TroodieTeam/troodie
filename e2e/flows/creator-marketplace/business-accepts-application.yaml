appId: com.troodie.troodie.com
env:
  TEST_EMAIL: test-business1@bypass.com
---
# Test: Business accepts creator application
# Priority: P1 (Critical for Creator Marketplace)
# Prerequisites:
#   - Business account (test-business1) logged in
#   - Pending application exists
# Tags: business, campaign, application, accept
# Navigation: More tab → Manage Campaigns → Campaign Detail → Applications
#
# NOTE: iOS 26 simulator toast corrupts accessibility tree.
# All More screen taps use point-based coordinates.
# Business More screen layout:
#   ~35% - Business Dashboard
#   ~42% - Manage Campaigns
#   ~48% - Discover Creators
#   ~55% - Campaign Analytics
#   ~61% - Restaurant Settings

# Login as business
- runFlow: ../../helpers/login-bypass.yaml

# Navigate to More tab (rightmost tab)
- tapOn:
    point: "90%,97%"

- waitForAnimationToEnd
- waitForAnimationToEnd

# Take screenshot to see More screen layout
- takeScreenshot: "business-more-screen"

# Tap Manage Campaigns (~42% from top)
- tapOn:
    point: "50%,42%"

- waitForAnimationToEnd
- waitForAnimationToEnd

# Take screenshot
- takeScreenshot: "business-manage-campaigns"

# Verify campaigns list loaded
- assertVisible:
    text: "Test Campaign"
    optional: true

# Tap on the test campaign
- tapOn:
    text: "Test Campaign"
    optional: true

- waitForAnimationToEnd

# Navigate to Applications tab in campaign detail
- tapOn:
    text: "Applications"
    optional: true

- tapOn:
    text: "Applicants"
    optional: true

- waitForAnimationToEnd

# Find pending application
- assertVisible:
    text: "pending"
    optional: true

# Tap on first application
- tapOn:
    id: "application-card-0"
    optional: true

- tapOn:
    text: "View"
    optional: true

- waitForAnimationToEnd

# Accept the application
- scrollUntilVisible:
    element:
      text: "Accept"
    direction: DOWN
    optional: true

- tapOn:
    text: "Accept"
    optional: true

# Confirm acceptance
- waitForAnimationToEnd

- tapOn:
    text: "Confirm"
    optional: true

- tapOn:
    text: "Yes"
    optional: true

- waitForAnimationToEnd

# Verify acceptance
- assertVisible:
    text: "accepted"
    optional: true

- assertVisible:
    text: "Success"
    optional: true

- tapOn:
    text: "OK"
    optional: true

# Take screenshot
- takeScreenshot: "business-application-accepted"
