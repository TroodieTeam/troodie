      id: "notification-item-board_invite"
    direction: DOWN
    timeout: 5000

# ============================================================
# Step 6: Verify system types (1)
# ============================================================
- scrollUntilVisible:
    element:
      id: "notification-item-system"
    direction: DOWN
    timeout: 5000

# ============================================================
# Step 7: Verify campaign types (9)
# ============================================================
- scrollUntilVisible:
    element:
      id: "notification-item-campaign_opportunity"
    direction: DOWN
    timeout: 5000

- scrollUntilVisible:
    element:
      id: "notification-item-campaign_application_submitted"
    direction: DOWN
    timeout: 5000

- scrollUntilVisible:
    element:
      id: "notification-item-application_approved"
    direction: DOWN
    timeout: 5000

- scrollUntilVisible:
    element:
      id: "notification-item-application_rejected"
    direction: DOWN
    timeout: 5000

- scrollUntilVisible:
    element:
      id: "notification-item-campaign_deadline_approaching"
    direction: DOWN
    timeout: 5000

- scrollUntilVisible:
    element:
      id: "notification-item-deliverables_submitted"
    direction: DOWN
    timeout: 5000

- scrollUntilVisible:
