appId: com.troodie.troodie.com
env:
  TEST_EMAIL: test-consumer1@bypass.com
tags:
  - smoke
  - notifications
  - regression
---
# Notification Screen - Core Interactions
# Priority: P0 (Critical)
#
# Tests:
#   1. Navigate to notifications screen via deep link
#   2. Verify notification list loads (or empty state)
#   3. Mark all as read (if unread exist)
#   4. Pull-to-refresh
#
# Prerequisites:
#   - Seed notifications: node scripts/run-sql.js --dev data/test-data/dev/seed-notification-e2e.sql
# Account: consumer1@bypass.com (consumer)
#
# Run:
#   maestro test e2e/flows/notifications/notification-interactions.yaml

# ============================================================
# Step 1: Login
# ============================================================
- runFlow: ../../helpers/login-bypass.yaml

- waitForAnimationToEnd

# ============================================================
# Step 2: Navigate to Notifications
# ============================================================
- openLink: troodie://notifications

- tapOn:
    text: "Open"
    optional: true

- waitForAnimationToEnd

# Wait for the notifications screen to appear
- extendedWaitUntil:
    visible: "Notifications"
    timeout: 10000

- takeScreenshot: "notifications-screen-loaded"

# ============================================================
# Step 3: Verify notification content
# ============================================================

# The header should be visible
- assertVisible:
    id: "notifications-header"

# ============================================================
# Step 4: Scroll through notifications
# ============================================================
- swipe:
    direction: UP

- waitForAnimationToEnd

- takeScreenshot: "notifications-scrolled"

# ============================================================
# Step 5: Mark all as read (if button visible)
# ============================================================
- tapOn:
    id: "mark-all-read-button"
    optional: true

- waitForAnimationToEnd

- takeScreenshot: "notifications-marked-read"

# ============================================================
# Step 6: Pull to refresh
# ============================================================
- swipe:
    direction: DOWN
    duration: 1000

- waitForAnimationToEnd
- waitForAnimationToEnd

- takeScreenshot: "notifications-after-refresh"

# ============================================================
# Step 7: Tap a notification (if any exist)
# ============================================================
# Try tapping a follow notification (seeded data uses DB type names)
- tapOn:
    id: "notification-item-follow"
    optional: true

- waitForAnimationToEnd

# Go back if we navigated
- back

- waitForAnimationToEnd

- takeScreenshot: "notifications-complete"
