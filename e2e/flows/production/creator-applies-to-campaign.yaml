appId: com.troodie.troodie.com
env:
  TEST_EMAIL: prod-creator1@bypass.com
---
# Production E2E: Creator applies to a campaign
# Account: prod-creator1@bypass.com (Foodie Lens) (OTP: 000000)
# Tests: Campaign discovery, application submission
# Prerequisites: Robust test data seeded (campaigns exist for business2/business3)

# Login
- runFlow: ../../helpers/login-bypass.yaml

# Verify home screen loaded
- extendedWaitUntil:
    visible: "Your Boards"
    timeout: 15000

# Dismiss any toast that might block the tab bar
- runFlow: ../../helpers/dismiss-toast.yaml

# Navigate to More tab
- tapOn:
    point: "90%,97%"

- waitForAnimationToEnd
- waitForAnimationToEnd

# Tap Explore Campaigns (~42% from top)
- tapOn:
    point: "50%,42%"

- waitForAnimationToEnd
- waitForAnimationToEnd

- takeScreenshot: "prod-creator-campaign-list"

# Scroll to find a campaign with $ indicator (paid)
- scrollUntilVisible:
    element:
      text: "$"
    direction: DOWN
    timeout: 10000
    optional: true

# Tap on first visible campaign card
- tapOn:
    text: "Campaign"
    index: 0
    optional: true

- waitForAnimationToEnd

- takeScreenshot: "prod-creator-campaign-detail"

# Look for Apply button
- scrollUntilVisible:
    element:
      text: "Apply"
    direction: DOWN
    optional: true

- tapOn:
    text: "Apply"
    optional: true

- tapOn:
    text: "Apply Now"
    optional: true

- waitForAnimationToEnd

# Fill cover letter if form appears
- tapOn:
    id: "cover-letter-input"
    optional: true

- inputText: "Production E2E test - I'd love to create content for your restaurant!"
- hideKeyboard

# Submit application
- scrollUntilVisible:
    element:
      text: "Submit"
    direction: DOWN
    optional: true

- tapOn:
    text: "Submit Application"
    optional: true

- tapOn:
    text: "Submit"
    optional: true

- waitForAnimationToEnd

# Handle confirmation
- tapOn:
    text: "OK"
    optional: true

- tapOn:
    text: "Done"
    optional: true

- takeScreenshot: "prod-creator-application-result"
