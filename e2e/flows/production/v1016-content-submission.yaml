appId: com.troodie.troodie.com
---
# v1.0.16.b1 FEATURE: Content Submission Flow (Creator View)
# Verifies the two-step deliverable workflow via screenshots.
#
# Account: prod-creator2@bypass.com
# Time: ~1-2 minutes with session injection
#
# Run:
#   ./e2e/helpers/inject-session.sh prod-creator2@bypass.com
#   maestro test e2e/flows/production/v1016-content-submission.yaml

# ============================================================
# Launch (pre-authenticated)
# ============================================================
- runFlow: ../../helpers/authenticated-launch.yaml

- takeScreenshot: "v1016-csf-home"

# ============================================================
# Navigate to More tab → My Deliverables
# ============================================================
- runFlow: ../../helpers/dismiss-toast.yaml

# More tab
- tapOn:
    point: "90%,97%"

- waitForAnimationToEnd
- waitForAnimationToEnd

- takeScreenshot: "v1016-csf-more-screen"

# Creator More: My Deliverables (~55% from top) — point-based
- tapOn:
    point: "50%,55%"

- waitForAnimationToEnd
- waitForAnimationToEnd

- takeScreenshot: "v1016-csf-deliverables-list"

# ============================================================
# Scroll through deliverables list
# ============================================================
- swipe:
    direction: UP

- waitForAnimationToEnd

- takeScreenshot: "v1016-csf-deliverables-scrolled"

# Scroll back to top
- swipe:
    direction: DOWN

- waitForAnimationToEnd

# ============================================================
# Tap first deliverable card (~25% from top)
# ============================================================
- tapOn:
    point: "50%,25%"

- waitForAnimationToEnd
- waitForAnimationToEnd

- takeScreenshot: "v1016-csf-deliverable-detail"

# Scroll to see full deliverable form
- swipe:
    direction: UP

- waitForAnimationToEnd

- takeScreenshot: "v1016-csf-deliverable-detail-scrolled"

# Scroll more to see bottom
- swipe:
    direction: UP

- waitForAnimationToEnd

- takeScreenshot: "v1016-csf-deliverable-bottom"

- takeScreenshot: "v1016-csf-complete"
