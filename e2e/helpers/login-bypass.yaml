appId: com.troodie.troodie.com
---
# Reusable: Login with bypass account (OTP: 000000)
# Usage: runFlow with env.TEST_EMAIL set
# Example:
#   env:
#     TEST_EMAIL: prod-creator1@bypass.com
#   - runFlow: helpers/login-bypass.yaml

- launchApp:
    clearState: true
    clearKeychain: true

# Handle Expo Dev Client launcher if shown (multiple UI variants)
# Variant 1: Tap the server URL to connect
- tapOn:
    text: "http://localhost:8081"
    optional: true

- waitForAnimationToEnd

# Variant 2: Expo Dev Client modal with "Go home" button (SDK 54+)
- tapOn:
    text: "Go home"
    optional: true

- waitForAnimationToEnd

# Variant 3: Dismiss Expo developer menu via Close
# NOTE: Do NOT tap "Skip" here - it conflicts with the welcome screen's Skip button
- tapOn:
    text: "Close"
    optional: true

- waitForAnimationToEnd

# Wait for welcome screen - use unique text that only appears on onboarding welcome
# "Discover Your Perfect" is unique to the welcome screen (not the home screen)
- extendedWaitUntil:
    visible: "Discover Your Perfect"
    timeout: 15000

# Tap Log in (for existing accounts) - use testID for reliable matching
# The "Log in" text is inside a nested TouchableOpacity that text selectors miss
- tapOn:
    id: "login-link"

# Wait for login screen to load
- extendedWaitUntil:
    visible: "Welcome back!"
    timeout: 10000

# Tap email input field (has autoFocus but tap to ensure focus)
- tapOn:
    id: "email-input"

- inputText: ${TEST_EMAIL}
- hideKeyboard
- waitForAnimationToEnd

# Tap Send Code button (optional - hideKeyboard may have already triggered it)
- tapOn:
    text: "Send Code"
    optional: true

- waitForAnimationToEnd

# Wait for OTP screen to load
- extendedWaitUntil:
    visible: "Enter the code sent"
    timeout: 10000

# Enter OTP code: 000000 (one digit at a time for auto-advancing fields)
- inputText: "0"
- inputText: "0"
- inputText: "0"
- inputText: "0"
- inputText: "0"
- inputText: "0"

# OTP should auto-submit when all 6 digits are entered
# But tap Verify as backup
- tapOn:
    text: "Verify"
    optional: true

# Handle potential auth error dialog
- tapOn:
    text: "OK"
    optional: true

- waitForAnimationToEnd

# Wait for login to complete - look for content that appears after login
- extendedWaitUntil:
    visible: "Your Boards"
    timeout: 15000

# Dismiss "Error getting current location" toast that covers the tab bar
# iOS 26 simulator shows persistent location error toast at bottom
# Use point-based tap on the toast close button area (right side of toast)
- tapOn:
    point: "93%,95%"
    optional: true

# Extra waits to let toast settle (per MAESTRO_BEST_PRACTICES.md)
- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd
