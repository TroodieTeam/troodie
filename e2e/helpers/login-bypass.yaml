appId: com.troodie.troodie.com
---
# Reusable: Login with bypass account (OTP: 000000)
# Usage: runFlow with env.TEST_EMAIL set
# Example: 
#   env:
#     TEST_EMAIL: prod-creator1@bypass.com
#   - runFlow: helpers/login-bypass.yaml

- launchApp:
    clearState: true
    clearKeychain: true

# Handle Expo Dev Client launcher if shown
- tapOn:
    text: "http://localhost:8081"
    optional: true

- waitForAnimationToEnd

# Dismiss Expo developer menu if shown
- tapOn:
    text: "Close"
    optional: true

- waitForAnimationToEnd

# Or tap Continue if shown
- tapOn:
    text: "Continue"
    optional: true

- waitForAnimationToEnd

# Wait for welcome/onboarding screen
- extendedWaitUntil:
    visible: "GET STARTED"
    timeout: 15000

# Tap Log in (for existing accounts)
- tapOn:
    text: "Log in"
    optional: true

# Or tap Get Started / Sign In
- tapOn:
    text: "Get Started"
    optional: true

- tapOn:
    text: "Sign In"
    optional: true

# Wait for email screen to load
- waitForAnimationToEnd

# Enter email - tap on placeholder to focus
- tapOn:
    text: "user@example.com"
    optional: true

- tapOn:
    id: "email-input"
    optional: true

- tapOn:
    text: "Continue with Email"
    optional: true

- inputText: ${TEST_EMAIL}
- hideKeyboard

# Continue to OTP - try multiple button texts
- tapOn:
    text: "Send Code"
    optional: true

- tapOn:
    text: "Continue"
    optional: true

- tapOn:
    text: "Next"
    optional: true

- waitForAnimationToEnd

# Wait for OTP screen to load
- extendedWaitUntil:
    visible: "Enter the code sent"
    timeout: 10000

# Enter OTP digits one by one (6-digit code: 000000)
# The OTP field auto-focuses on first input
- inputText: "0"
- inputText: "0"
- inputText: "0"
- inputText: "0"
- inputText: "0"
- inputText: "0"

# OTP should auto-submit when all 6 digits are entered
# But tap Verify as backup
- tapOn:
    text: "Verify"
    optional: true

# Handle potential auth error dialog
- tapOn:
    text: "OK"
    optional: true

- waitForAnimationToEnd

# Wait for login to complete - look for content that appears after login
- extendedWaitUntil:
    visible: "Your Saves"
    timeout: 15000
